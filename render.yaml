# Render blueprint: one free web service + one free managed Postgres.
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" and point it here.
services:
  - type: web
    name: wallet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_POOL_MAX
        value: "10"          # free Postgres caps connections; keep the pool small
      - key: ADMIN_TOKEN
        generateValue: true   # shown once in the Render dashboard; used only to seed balances
      # Render's connectionString is postgresql://user:pass@host/db — the app's
      # DatabaseUrlEnvironmentPostProcessor turns DATABASE_URL into a JDBC URL + credentials.
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString

databases:
  - name: wallet-db
    plan: free
    databaseName: wallet
    user: wallet
